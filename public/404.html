<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>منظومة إدارة العيادات والمستشفيات</title>
    <script type="text/javascript">
      // SPA Single Page App redirect for GitHub Pages
      const l = window.location;
      if (l.pathname && l.pathname !== '/') {
        l.replace(l.protocol + '//' + l.host + l.pathname.split('/').slice(0, -1).join('/') + '/#' + l.pathname);
      }
    </script>
  </head>
  <body>
    <div style="text-align: center; padding: 50px; font-family: sans-serif;">
      <h2>جاري التوجيه إلى المنظومة...</h2>
    </div>
  </body>
</html>
